name: windows

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6.8.3（MSVC 2022 64bit）
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: 配置 CMake
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DQT_SDK_DIR="$env:QT_ROOT_DIR"

      - name: 构建
        run: cmake --build build --config Release --parallel

      - name: 部署 Qt 运行库与许可
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem -Recurse build -Filter GManager.exe |
            Select-Object -First 1
          if (-not $exe) { throw "未找到 GManager.exe" }
          Copy-Item $exe.FullName dist/
          $dll = Get-ChildItem -Recurse build -Filter ElaWidgetTools.dll |
            Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName dist/ }
          # 一并把 ElaWidgetTools.dll 交给 windeployqt，确保它依赖的 Qt 库
          # 也被扫描到；缺失时不传，避免命令失败
          $deployArgs = @('--release', '--compiler-runtime',
            '--no-translations', '--no-system-d3d-compiler',
            '--no-opengl-sw', 'dist/GManager.exe')
          if ($dll) { $deployArgs += 'dist/ElaWidgetTools.dll' }
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" @deployArgs
          # 兜底：若仍未带上 MSVC 运行库，从 VS 的 Redist 目录补拷
          if (-not (Test-Path dist/msvcp140.dll)) {
            $crt = Get-ChildItem `
              "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" `
              -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($crt) {
              Copy-Item "$($crt.FullName)\*.dll" dist/
              Write-Host "已从 $($crt.FullName) 补拷 MSVC 运行库"
            } else {
              Write-Warning "未找到 MSVC CRT 目录，分发时需自行安装 VC++ 运行库"
            }
          }
          Copy-Item LICENSE, LICENSE.GPL-3, README.md dist/
          Copy-Item third_party/ElaWidgetTools/LICENSE dist/ElaWidgetTools-MIT.txt
          Get-ChildItem dist | Select-Object Name, Length | Format-Table

      # 直接上传 dist 目录：artifact 自带压缩，不再自己压一层，
      # 否则下载后是「zip 套 zip」，需要解两次
      - uses: actions/upload-artifact@v4
        with:
          name: GManager-windows-x64
          path: dist/
          if-no-files-found: error
